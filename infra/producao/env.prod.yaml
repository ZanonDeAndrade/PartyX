# MODELO das variáveis NÃO secretas do serviço partyx (produção), no mesmo formato de infra/homologacao/env.hml.yaml.
# Situação (13/10/2026): SÓ o arquivo. O infra/producao/deploy.sh ainda monta as variáveis pela linha de comando e NÃO lê este
# arquivo; ligar a leitura (com python3 -I infra/env-check.py infra/producao/env.prod.yaml producao) é passo seguinte, a fazer junto
# com o próximo deploy de produção autorizado. Valores tirados dos padrões do deploy.sh de produção; conferir com a revisão no ar antes.
# Segredos (banco, sessão, QR, SMTP, Turnstile, Mercado Pago) ficam no Secret Manager e NUNCA entram aqui.
# Formato restrito: uma linha `NOME: "valor"` por variável, valor sempre entre aspas duplas.

# Execução (512 MiB; heap do V8 em 320 MB, docs/operacao/memoria.md)
NODE_ENV: "production"
NODE_OPTIONS: "--max-old-space-size=320"
APP_ENV: "producao"
DB_POOL_MAX: "5"
MAINTENANCE_MODE: "false"

# Entrada: Firebase Hosting (2 saltos). A barreira de Host é sempre ligada em produção (não aceita PUBLIC_HOST_CHECK=false).
# Trocar pelo domínio quando existir (D-08).
PUBLIC_BASE_URL: "https://partyx-producao.web.app"
TRUSTED_PROXY_HOPS: "2"

# Rotinas e filas
JOBS_AUDIENCE: "https://partyx-391817439013.southamerica-east1.run.app"
JOBS_CALLER_EMAIL: "partyx-scheduler@partyx-producao.iam.gserviceaccount.com,partyx-tasks@partyx-producao.iam.gserviceaccount.com"
TASKS_QUEUE: "projects/partyx-producao/locations/southamerica-east1/queues/partyx-conciliacao"
TASKS_INVOKER_EMAIL: "partyx-tasks@partyx-producao.iam.gserviceaccount.com"
BANNER_BUCKET: "partyx-producao-banners"

# Abuso: Turnstile DESLIGADO por decisão de 06/10/2026 (README-DEPLOY 8b); limites globais no banco
TURNSTILE_ENABLED: "false"
GLOBAL_SIGNUPS_PER_HOUR: "1000"
SIGNUPS_PER_IP_PER_HOUR: "100"
GLOBAL_RECOVERIES_PER_HOUR: "60"

# Venda e cadastro FECHADOS até o go-live (travas do deploy.sh: GO_LIVE_CONFIRMED, textos legais, VISUAL_APPROVED)
SALES_OPEN: "false"
SIGNUP_OPEN: "false"
VISUAL_APPROVED: "false"
QR_HMAC_CURRENT: "1"

# Gateway: hoje "none". Ao ligar o Mercado Pago (README-DEPLOY 8f): PAYMENT_GATEWAY "mercadopago", GATEWAY_ENVIRONMENT "producao" e
# MP_COLLECTOR_ID com o id da conta da PartyX (só com autorização expressa).
PAYMENT_GATEWAY: "none"

# E-mail: remetente do domínio autenticado da PartyX (D-08/D-09), PENDENTE. O SMTP é o segredo smtp-url.
# EMAIL_FROM: ""

# Textos legais na imagem (conteudo-legal/, fora do Git); versões e datas entram aqui quando a PartyX fornecer (D-11):
LEGAL_CONTENT_DIR: "/app/legal"
# TERMS_VERSION, TERMS_DATE, PRIVACY_VERSION, PRIVACY_DATE, CANCELLATION_VERSION, CANCELLATION_DATE, PARTYX_* e EMAIL_REPLY_TO.
