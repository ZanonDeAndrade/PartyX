# Variáveis NÃO secretas do serviço partyx (produção), no mesmo formato de infra/homologacao/env.hml.yaml. Fonte única: o
# infra/producao/deploy.sh publica com --env-vars-file, que troca TODAS as variáveis do serviço por estas, e recusa antes do build se
# o conferidor (python3 -I infra/env-check.py infra/producao/env.prod.yaml producao) acusar algo. Revisado com o responsável em 13/10/2026.
# Segredos (banco, sessão, QR, SMTP, Turnstile, Mercado Pago) ficam no Secret Manager e NUNCA entram aqui.
# Formato restrito: uma linha `NOME: "valor"` por variável, valor sempre entre aspas duplas.

# Execução (512 MiB; heap do V8 em 320 MB, docs/operacao/memoria.md)
NODE_ENV: "production"
NODE_OPTIONS: "--max-old-space-size=320"
APP_ENV: "producao"
DB_POOL_MAX: "5"
MAINTENANCE_MODE: "false"

# Entrada: Firebase Hosting (2 saltos). A barreira de Host é sempre ligada em produção (não aceita PUBLIC_HOST_CHECK=false).
# Domínio próprio (decisão de 14/10/2026). Depois desta troca o partyx-producao.web.app responde "Host não autorizado" (aceito pelo
# responsável em 14/10/2026; redirecionamento para o domínio fica para depois). A rotina diária e a verificação de saúde usam este endereço.
PUBLIC_BASE_URL: "https://partyx.com.br"
TRUSTED_PROXY_HOPS: "2"

# Rotinas e filas
JOBS_AUDIENCE: "https://partyx-391817439013.southamerica-east1.run.app"
JOBS_CALLER_EMAIL: "partyx-scheduler@partyx-producao.iam.gserviceaccount.com,partyx-tasks@partyx-producao.iam.gserviceaccount.com"
TASKS_QUEUE: "projects/partyx-producao/locations/southamerica-east1/queues/partyx-conciliacao"
TASKS_INVOKER_EMAIL: "partyx-tasks@partyx-producao.iam.gserviceaccount.com"
BANNER_BUCKET: "partyx-producao-banners"

# Abuso: Turnstile DESLIGADO por decisão de 06/10/2026, mantida na abertura das vendas em 18/10/2026 (README-DEPLOY 8b); limites no
# banco. Cadastro: 1.000 por hora no total e 50 por hora por IP (decisão de 18/10/2026, na abertura das vendas: as operadoras de
# celular põem muita gente atrás do mesmo IP; antes eram 10, decisão de 13/10/2026). Recuperação de senha: 60 por hora no total.
TURNSTILE_ENABLED: "false"
GLOBAL_SIGNUPS_PER_HOUR: "1000"
SIGNUPS_PER_IP_PER_HOUR: "50"
GLOBAL_RECOVERIES_PER_HOUR: "60"

# Compra e portaria (iguais aos padrões do código, explícitos por decisão de 13/10/2026): reserva de 30 min (mínimo do Pix no
# Mercado Pago, D-03), 6 ingressos por compra (D-05) e portaria aberta de 12 h antes a 24 h depois do início do evento.
RESERVATION_MINUTES: "30"
MAX_TICKETS_PER_ORDER: "6"
GATE_CLOSED_WINDOW_BEFORE_HOURS: "12"
GATE_CLOSED_WINDOW_AFTER_HOURS: "24"

# Venda ABERTA a partir da release-2026-10-18 (autorização do Bernardo, docs/registros/autorizacao-abertura-vendas-2026-10-15.md;
# travas do deploy.sh: GO_LIVE_CONFIRMED, os três textos legais, VISUAL_APPROVED). Visual aprovado por escrito pelo Bernardo em
# 18/10/2026 (CA-33, docs/registros/aprovacao-visual.md). Para fechar a venda: SALES_OPEN "false" aqui e nova candidata e virada, ou
# rollback (README-DEPLOY, seção 6). Cadastro ABERTO por autorização de 14/10/2026 (docs/registros/autorizacao-cadastro-producao-2026-10-14.md);
# exige Termos e Privacidade publicados (D-84). Para fechar o cadastro: SIGNUP_OPEN "false" aqui e nova candidata e virada.
SALES_OPEN: "true"
SIGNUP_OPEN: "true"
VISUAL_APPROVED: "true"
QR_HMAC_CURRENT: "1"

# Gateway: Mercado Pago de PRODUÇÃO, com as vendas fechadas (autorização de 13/10/2026). O deploy.sh confere que o token do segredo
# mp-access-token NÃO é de usuário de teste e que a conta dele é esta. MP_COLLECTOR_ID: id da conta da PartyX, obtido da API no
# bloco 2 da publicação (13/10/2026, lido de /users/me com o token de produção; confirmar com a PartyX que é a conta dela).
PAYMENT_GATEWAY: "mercadopago"
GATEWAY_ENVIRONMENT: "producao"
MP_COLLECTOR_ID: "3563483345"

# E-mail: remetente do domínio autenticado da PartyX (D-08/D-09), definido pelo responsável em 14/10/2026. O SMTP é o segredo smtp-url,
# que só entra no serviço quando tiver versão (depois do Verify do Resend); sem ele nenhum e-mail sai.
EMAIL_FROM: "PartyX <ingressos@partyx.com.br>"

# Textos legais na imagem (conteudo-legal/, no Git, vindos da tag); versão e data andam com o arquivo (D-11, D-61). Termos e Privacidade
# 1.1 recebidos do responsável em 14/10/2026; 1.2 e a Política de Cancelamento, Troca e Reembolso 1.0 em 15/10/2026 (transferência,
# D-87; sem arrependimento, D-88), publicados só com o OK do Bernardo.
LEGAL_CONTENT_DIR: "/app/legal"
# A vigência é a DATA DA VIRADA. Termos 1.3 e Política de Cancelamento 1.1 (taxa de serviço, D-90) publicados em 19/10/2026 com a taxa
# em 0%; Termos 1.4 no mesmo dia, com a porcentagem (7,5%). Termos 1.5 (release do desconto por promoter, D-91): a porcentagem sai do
# texto (a vigente aparece na página do evento e na tela de compra) e o código de divulgação pode dar desconto. A 1.5 só sobe com a
# aprovação do Bernardo ao texto (`docs/registros/termos-1-5-desconto-por-promoter.md`) e com TERMS_DATE no dia da virada (o
# `deploy.sh virar` recusa texto de versão nova com data diferente da do dia). Privacidade 1.2 e Política 1.1 não mudam. Quem já aceitou
# a 1.4 aceita a 1.5 no próximo login ou checkout; a Política é aceita em cada compra.
# Evento privado (D-92): Privacidade 1.3, Termos 1.6 e Política de Cancelamento 1.2, aprovados pelo Bernardo em 20/10/2026
# (`docs/registros/evento-privado-textos-propostos.md`), sobem com a release da migração 0019 (o `deploy.sh conferir` recusa essa release
# sem eles). As datas são as da virada prevista: se ela não for em 20/10/2026, troque TERMS_DATE, PRIVACY_DATE e CANCELLATION_DATE para
# o dia dela e refaça a candidata. Quem aceitou a 1.5 e a 1.2 aceita a 1.6 e a 1.3 no próximo login ou checkout.
TERMS_VERSION: "1.6"
TERMS_DATE: "2026-10-20"
PRIVACY_VERSION: "1.3"
PRIVACY_DATE: "2026-10-20"
# Política de Cancelamento, Troca e Reembolso: exigida para vender e aceita no checkout.
CANCELLATION_VERSION: "1.2"
CANCELLATION_DATE: "2026-10-20"
# Textos de menores (14/10/2026): Termo de Ciência (aceito no checkout por quem terá 16 ou 17 anos) e texto do Termo de Autorização.
MINOR_TERM_VERSION: "1.0"
MINOR_TERM_DATE: "2026-10-14"
MINOR_AUTHORIZATION_VERSION: "1.0"
MINOR_AUTHORIZATION_DATE: "2026-10-14"

# Dados públicos da PartyX (rodapé, e-mails, manutenção e autorização de menor), revistos pelo responsável em 14/10/2026 com a aprovação
# do Bernardo. O rodapé do site mostra só o CNPJ (sem razão social nem endereço); a razão social segue nos e-mails, na manutenção e na
# autorização. Sem endereço publicado: PARTYX_ADDRESS fica fora do arquivo (vazio). O WhatsApp leva o DDI: o link sai wa.me/5555991566900.
# EMAIL_REPLY_TO vazio: as respostas aos e-mails vão para PARTYX_SUPPORT_EMAIL.
PARTYX_LEGAL_NAME: "58.471.403 BERNARDO PEIXOTO FORTES BITTENCOURT"
PARTYX_CNPJ: "58.471.403/0001-07"
PARTYX_SUPPORT_EMAIL: "partyx992@gmail.com"
PARTYX_SUPPORT_WHATSAPP: "+55 55 99156-6900"
PARTYX_SUPPORT_HOURS: "de segunda a sexta-feira, em horário comercial"

# Retenção dos dados técnicos (D-62): 6 meses (180 dias), como diz a Política de Privacidade 1.0. A limpeza roda pela rotina
# partyx-limpeza-retencao do Cloud Scheduler (deploy.sh varredura). Sessões: só as já encerradas há mais que o prazo.
RETENTION_SESSIONS_DAYS: "180"
RETENTION_LOGIN_ATTEMPTS_DAYS: "180"
RETENTION_PASSWORD_RESETS_DAYS: "180"
