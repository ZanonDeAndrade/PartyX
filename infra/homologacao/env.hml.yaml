# Variáveis NÃO secretas do serviço partyx-hml (Cloud Run, --env-vars-file). Fonte única: o deploy.sh troca TODAS as variáveis do
# serviço por estas. Segredos (banco, sessão, QR, Turnstile, SMTP, Mercado Pago) ficam no Secret Manager e NUNCA entram aqui.
# Formato restrito, conferido pelo deploy.sh: uma linha "NOME: \"valor\"" por variável, valor sempre entre aspas duplas, sem listas
# nem blocos. Variáveis obrigatórias vazias ou ausentes fazem o deploy recusar ANTES do build.

# Execução (512 MiB de memória no deploy.sh; heap do V8 em 320 MB, docs/operacao/memoria.md)
NODE_ENV: "production"
NODE_OPTIONS: "--max-old-space-size=320"
APP_ENV: "homologacao"
ENABLE_PROTOTYPE: "true"
DB_POOL_MAX: "5"
MAINTENANCE_MODE: "false"

# Entrada: Firebase Hosting na frente (2 saltos medidos, README-DEPLOY seção 1) e barreira de Host igual à de produção
PUBLIC_BASE_URL: "https://partyx-hml.web.app"
PUBLIC_HOST_CHECK: "true"
TRUSTED_PROXY_HOPS: "2"

# Rotinas e filas (audience = URL run.app com o número do projeto, a mesma do scheduler.sh)
JOBS_AUDIENCE: "https://partyx-hml-508762490937.southamerica-east1.run.app"
JOBS_CALLER_EMAIL: "partyx-scheduler@partyx-hml.iam.gserviceaccount.com,partyx-tasks@partyx-hml.iam.gserviceaccount.com"
TASKS_QUEUE: "projects/partyx-hml/locations/southamerica-east1/queues/partyx-conciliacao"
TASKS_INVOKER_EMAIL: "partyx-tasks@partyx-hml.iam.gserviceaccount.com"
BANNER_BUCKET: "partyx-hml-banners"

# Verificação humana: ligada, com a chave PÚBLICA de teste da Cloudflare (a secreta de teste está no segredo turnstile-secret)
TURNSTILE_ENABLED: "true"
TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

# Gateway: Mercado Pago de TESTE (PDF 7.1). O deploy.sh confere que mp-access-token é de usuário de teste desta conta.
# Para o fictício: PAYMENT_GATEWAY "mock", HOMOLOGACAO_GATEWAY_FICTICIO "true", sem GATEWAY_ENVIRONMENT e MP_COLLECTOR_ID (1 instância).
PAYMENT_GATEWAY: "mercadopago"
GATEWAY_ENVIRONMENT: "sandbox"
MP_COLLECTOR_ID: "3758743646"

# E-mail (o SMTP é o segredo smtp-url, hoje a caixa de captura Ethereal). Remetente escolhido pelo responsável em 13/10/2026; com SMTP real, trocar pelo domínio autenticado (D-08/D-09).
EMAIL_FROM: "PartyX Homologação <ingressos@partyx-hml.web.app>"

# Textos legais: a imagem leva conteudo-legal/ (fora do Git); sem os arquivos, as páginas mostram o aviso de homologação.
LEGAL_CONTENT_DIR: "/app/legal"

# Opcionais (padrões no código, server/src/config.ts): RECONCILE_*, PARTYX_SUPPORT_*, PARTYX_LEGAL_NAME, PARTYX_CNPJ, PARTYX_ADDRESS,
# TERMS_VERSION, PRIVACY_VERSION, CANCELLATION_VERSION, *_DATE, EMAIL_REPLY_TO. Acrescente aqui, no mesmo formato, quando houver valor.
