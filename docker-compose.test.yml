# PostgreSQL descartável para testes de integração (não é o Neon).
# Sobe em memória (tmpfs), na porta 55432 por padrão.
# Os scripts npm usam o projeto Compose partyx-test.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: partyx
      POSTGRES_PASSWORD: partyx_test_only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${PARTYX_TEST_DB_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U partyx']
      interval: 2s
      timeout: 3s
      retries: 20
